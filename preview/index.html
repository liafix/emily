<!doctype html><html lang="sk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0B0A0E"><meta name="robots" content="noindex,nofollow"><title>For Emily. — Offline interactive preview</title><link rel="icon" href="../public/icon.svg"><link rel="stylesheet" href="../app/globals.css"><style>
.preview-label{position:fixed;z-index:30;right:16px;bottom:96px;font:8px monospace;letter-spacing:.12em;color:#a58f9e;background:#1e1421cc;padding:7px 9px;border:1px solid #4c334a}.preview-art{display:flex;align-items:center;justify-content:center;width:100%;max-width:480px;aspect-ratio:1;margin:auto;position:relative}.preview-art>.intro-core{width:55%}.preview-art>.intro-ellipse{width:74%;height:74%}.screen-in{animation:screenFade .56s both}.preview-arrows{display:grid;place-items:center;gap:14px}.preview-back{color:#beaabe;border:0;background:none;padding:12px}.preview-graph{position:relative;width:80%;height:65%;border-radius:50%;background:radial-gradient(circle,#79526944,transparent 62%);display:grid;place-items:center}.preview-wave{display:flex;align-items:center;justify-content:center;gap:3px;width:100%;height:90px}.preview-wave i{width:3px;display:block;background:linear-gradient(#ffebf3,#9B5E7C);border-radius:4px;animation:previewAudio 1.2s infinite alternate ease-in-out}.preview-orbit{position:absolute;inset:8%;border:1px solid #8e607a44;border-radius:50%;box-shadow:0 0 55px #ad6f9744}.preview-orbit:nth-child(2){inset:20%;border-style:dashed}.preview-eye{width:72%;height:32%;border:1px solid #e2bad1b3;border-radius:50%;position:relative;box-shadow:0 0 55px #be8ba944,inset 0 0 55px #be8ba91c}.preview-eye:after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:12%;aspect-ratio:1;background:#b88ca8;box-shadow:0 0 70px 30px #b88ca888;border-radius:50%}.preview-strands{position:relative;width:100%;height:100%;overflow:hidden;display:flex;align-items:center;justify-content:center}.preview-strands svg{height:100%;width:100%}.preview-desktop-copy{position:relative;z-index:2}.preview-invitation-inner{position:relative;z-index:2}.preview-small-note{color:#968493;font:10px monospace;letter-spacing:.1em;margin:18px 0}.preview-skip{display:inline-flex}.preview-response{max-width:550px}.preview-screen-main{width:100%}@keyframes screenFade{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}@keyframes previewAudio{to{transform:scaleY(.3);opacity:.4}}
@media(max-width:820px){.scene-arrival .preview-art{position:absolute;opacity:.32;width:440px;height:440px;right:-190px;top:50%;transform:translateY(-50%);pointer-events:none}.scene-dossier .dossier-wrap{width:100%}.scene-details .detail-artwork{min-height:220px}.preview-graph{width:76%;height:76%}}
@media(max-width:520px){.preview-label{right:5px;bottom:72px;font-size:6px;padding:5px}.scene-arrival .preview-art{right:-260px}.preview-art{min-width:0}.scene-details .detail-content{min-height:0}.scene-details .detail-artwork{max-height:245px}.preview-graph{height:220px}.preview-response .display-response{font-size:62px}}
@media(prefers-reduced-motion:reduce){.screen-in,.preview-wave i{animation:none!important}}
</style></head><body>
<div class="experience"><div class="global-ambient" aria-hidden="true"><div class="ambient-orb orb-left"></div><div class="ambient-orb orb-right"></div><div class="noise-film"></div><span class="dust-field" id="dust"></span></div>
<header class="site-header"><button id="home" class="brand" aria-label="Späť na úvod"><span class="brand-emblem">E<span>✳</span></span><span class="brand-name">FOR EMILY<span class="brand-dot">.</span></span></button><div class="header-actions"><span class="header-private">AN INVITATION IN FIVE ACTS</span><button class="sound-toggle" id="audio" aria-pressed="false"><span class="sound-bars" id="bars"><i></i><i></i><i></i><i></i></span><span id="audio-text">ZVUK VYP.</span></button><button class="skip-control" id="skip">PREJSŤ NA POZVANIE <span>↗</span></button></div></header>
<div class="stage-edge edge-left" aria-hidden="true"><span>EST. 2026</span><span>MADE WITH INTENTION</span></div><div class="stage-edge edge-right" aria-hidden="true"><span>PRIVATE CORRESPONDENCE</span><span>REF. E–001</span></div>
<main class="stage" id="stage" tabindex="-1"><div class="scene-container" id="content"></div></main>
<footer class="site-footer"><div class="footer-counter"><span id="current-number">01</span><span class="counter-slash">/</span><span class="counter-total">05</span><span class="footer-label" id="current-label">THE ARRIVAL</span></div><nav class="chapter-track" aria-label="Priebeh príbehu" id="chapters"></nav><div class="footer-signature">A LITTLE THING, JUST FOR YOU <span>✳</span></div></footer></div>
<div class="preview-label" title="Náhľad založený na rovnakom vizuálnom systéme ako Next.js projekt">OFFLINE INTERACTIVE PREVIEW</div>
<script>
(()=>{'use strict';
const labels=['THE ARRIVAL','THE REQUEST','THE DETAILS','THE ANALYSIS','THE INVITATION'];
const state={chapter:0,detail:0,response:null,ambient:false,context:null,osc:[],gain:null,timer:null};
const el=id=>document.getElementById(id); const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
for(let i=0;i<26;i++){const p=document.createElement('i');p.className='dust';p.style.left=((i*47.21+9)%98)+'%';p.style.top=((i*29.47+12)%96)+'%';p.style.animationDelay=(-i*.37)+'s';p.style.opacity=.15+(i%5)*.095;el('dust').append(p)}
const button=(id,label,kind='cta-primary')=>`<button class="cta ${kind}" id="${id}"><span>${label}</span><span class="arrow-icon" aria-hidden="true">↗</span></button>`;
const eyebrow=t=>`<span class="eyebrow">${t}</span>`;
const introArt=()=>`<div class="preview-art intro-art" aria-hidden="true"><div class="intro-halo"></div><div class="intro-ellipse ellipse-a"></div><div class="intro-ellipse ellipse-b"></div><div class="intro-core"><span>e.</span></div><div class="intro-cross intro-cross-a"></div><div class="intro-cross intro-cross-b"></div><div class="intro-art-label">A PRIVATE NOTE</div></div>`;
const dossier=()=>`<div class="dossier-wrap"><div class="dossier-behind"></div><div class="dossier-paper"><div class="paper-top"><span>PRIVATE DOCUMENT</span><span>REF. E–001</span></div><div class="paper-monogram">E<span>✳</span></div><div class="paper-title">OFICIÁLNA ŽIADOSŤ<br>O KONZULTÁCIU</div><div class="paper-rule"></div><dl class="paper-fields">${[['ADRESÁT','Emily'],['OBLASŤ','Ekonomika a účtovníctvo'],['ŽIADATEĽ','Ja'],['STAV','Čaká na tvoje vyjadrenie']].map(([a,b])=>`<div><dt>${a}</dt><dd>${b}</dd></div>`).join('')}</dl><div class="paper-question">TÉMA: jedna ekonomická otázka, o ktorej sa rád poradím osobne.</div><div class="paper-bottom"><span>FOR YOUR CONSIDERATION</span><span class="stamp">PENDING<br>REVIEW</span></div></div><span class="dossier-serial">DOCUMENT FILED — NO. E–001</span></div>`;
function visual(i){if(i===0)return `<div class="preview-graph"><div class="preview-orbit"></div><div class="preview-orbit"></div><div class="preview-wave">${Array.from({length:38},(_,j)=>`<i style="height:${12+Math.abs(Math.sin(j*1.42)*Math.cos(j*.44))*90}%;animation-delay:${j*.05}s"></i>`).join('')}</div></div>`;
if(i===1)return '<div class="preview-graph"><div class="preview-eye"></div></div>';
return `<div class="preview-strands"><svg viewBox="0 0 480 390" fill="none">${Array.from({length:18},(_,j)=>`<path d="M${70+j*17} -12 C${-15+j*17} 125 ${174+j*17} 190 ${95+j*17} 410" stroke="${j%4===0?'#EED4E4':'#A57A94'}" stroke-opacity="${j%4===0?.74:.34}" stroke-width="${j%5===0?1.5:.65}"/>`).join('')}</svg></div>`}
function sceneHTML(){if(state.chapter===0)return `<section class="scene scene-arrival screen-in" aria-labelledby="title"><div class="scene-copy entrance-copy">${eyebrow('PERSONAL TRANSMISSION / 001')}<h1 class="display display-hero" id="title">Emily<span class="rose-period"></span></h1><h2 class="intro-subtitle">Mám na teba jednu trochu netradičnú otázku.</h2><p class="body-copy">Ale keď už programujem, povedal som si, že obyčajná správa by bola nuda. 😄</p>${button('next','Pozrieť otázku')}<p class="footnote">Sľubujem, nebude to test.</p></div>${introArt()}<div class="scene-side-caption">CREATED WITH A LITTLE TOO MUCH EFFORT FOR ONE QUESTION.</div></section>`;
if(state.chapter===1)return `<section class="scene scene-dossier screen-in" aria-labelledby="title"><div class="scene-copy dossier-copy">${eyebrow('02 / A LITTLE REQUEST')}<h1 class="display display-large" id="title">Jedna <em>malá</em> konzultácia.</h1><p class="body-copy">Viem, že chodíš na obchodnú, a napadlo mi, že by som sa ťa mohol spýtať na jednu vec z ekonomiky.</p><p class="body-copy muted-copy">Neboj, nechcem ťa skúšať. 😄 Len by ma zaujímal tvoj názor.</p>${button('next','A prečo práve ja?')}</div>${dossier()}</section>`;
if(state.chapter===2){const details=[['Tvoj hudobný vkus?','Fakt super.'],['A mimochodom...','Máš pekné oči.'],['A tie vlasy?','Veľmi ti pristanú.']];const d=details[state.detail];return `<section class="scene scene-details screen-in" aria-labelledby="title"><div class="details-panel"><div class="details-head">${eyebrow('03 / A FEW THINGS I NOTICED')}<span class="detail-count">0${state.detail+1} / 03</span></div><div class="detail-content"><div class="detail-artwork"><div class="details-art art-${['music','eyes','hair'][state.detail]}">${visual(state.detail)}<span class="art-coordinate">${['SOUND STUDY','LIGHT STUDY','SILHOUETTE STUDY'][state.detail]} — 00${state.detail+1}</span></div></div><div class="detail-words">${eyebrow('DETAIL 0'+(state.detail+1))}<h1 class="display display-large" id="title">${d[0]}</h1><p class="detail-answer">${d[1]}</p>${state.detail===2?'<p class="detail-aside">Dobre, toto už asi nemá s účtovníctvom nič spoločné. 😄</p>':''}</div></div><div class="details-bottom"><div class="step-dots">${[0,1,2].map(i=>`<span class="${i===state.detail?'active':''}"></span>`).join('')}</div>${button('next',state.detail===2?'Späť k serióznym veciam':'Ďalší detail')}</div></div></section>`}
if(state.chapter===3){const entries=[['PREDMET','Osobná konzultácia'],['ROZPOČET','Dve kávy'],['HLAVNÉ TÉMY','Ekonomika, hudba a čokoľvek ďalšie'],['OČAKÁVANÝ VÝSLEDOK','Príjemný rozhovor']];return `<section class="scene scene-analysis screen-in" aria-labelledby="title"><div class="scene-copy analysis-copy">${eyebrow('04 / THE FINANCIAL ANALYSIS')}<h1 class="display display-large" id="title">Má to svoj<br><em>potenciál.</em></h1><p class="body-copy">Myslím, že tento plán celkom dáva zmysel.<br>Ale ešte mi chýba tvoj názor.</p>${button('next','Zobraziť návrh')}</div><div class="analysis-sheet"><div class="analysis-meta"><span>FINANCIAL MEMO / 002</span><span>PERSONAL USE ONLY</span></div><div class="analysis-heading"><span class="analysis-spark">✳</span><div><span>PROJECT</span><h2>COFFEE<br><i>with Emily.</i></h2></div></div><div class="analysis-data">${entries.map(([a,b],i)=>`<div class="analysis-row"><span class="analysis-index">0${i+1}</span><span class="analysis-label">${a}</span><strong>${b}</strong></div>`).join('')}</div><div class="analysis-conclusion"><span class="analysis-mini-label">FINAL RECOMMENDATION</span><p>Ask Emily<br><em>in person.</em></p><span class="analysis-sign">e.</span></div><span class="sheet-foot">THIS IS NOT FINANCIAL ADVICE — JUST A REASON TO TALK.</span></div></section>`}
const response=state.response;
return `<section class="scene scene-invitation screen-in" aria-labelledby="title"><div class="invitation-art" aria-hidden="true"><div class="invitation-bloom"></div><div class="invitation-ring ring-one"></div><div class="invitation-ring ring-two"></div></div><div class="invitation-content">${eyebrow('05 / ONE LAST QUESTION')}${response===null?`<h1 class="display display-invite" id="title">Tak čo,<br><em>Emily?</em></h1><p class="invitation-lead">Nechcela by si niekedy skočiť na kávu?</p><p class="invitation-copy">Rád by som sa ťa spýtal na tú ekonomickú vec.<br>A úprimne, rád by som ťa aj trochu lepšie spoznal.</p><div class="invitation-actions">${button('yes','Napíšem ti ☕')}<button class="link-action" id="maybe">Možno inokedy</button><button class="link-action link-subtle" id="no">Nie, ďakujem</button></div>`:`<div class="response-content preview-response"><h1 class="display display-response" id="title">${response==='yes'?'Tak to ma potešilo.':response==='maybe'?'Jasné, úplne v pohode.':'V pohode, rozumiem.'}</h1><p class="invitation-lead">${response==='yes'?'Napíš mi a nejako sa dohodneme.':'Ďakujem, že si si to pozrela. :)'}</p>${response==='yes'?`<p class="invitation-copy">Kávu beriem na seba.</p><div class="response-actions">${button('copy','Skopírovať správu','cta-quiet')}</div><p class="contact-note">Kontakt ešte nie je nakonfigurovaný. Správu môžeš skopírovať.</p><div class="copy-fallback" id="fallback" hidden><textarea readonly aria-label="Text správy">Ahoj, ten web bol celkom originálny 😄 Kedy dáme tú kávu?</textarea></div>`:''}<button class="link-action reset-response" id="back">Späť na otázku</button></div>`}</div></section>`}
function goto(n){clearTimeout(state.timer);document.querySelector('.unfold-overlay')?.remove();state.timer=null;state.chapter=n;state.detail=0;state.response=null;render()}
function next(){if(state.chapter===2&&state.detail<2){state.detail++;render();return}if(state.chapter===3){wow();return}goto(Math.min(4,state.chapter+1))}
function wow(){if(reduce){goto(4);return}const overlay=document.createElement('div');overlay.className='unfold-overlay';overlay.innerHTML=`<div class="unfold-bg"></div><div class="unfold-document">${Array.from({length:8},(_,i)=>`<div class="unfold-strip" style="top:${i*12.5}%"></div>`).join('')}</div><div class="unfold-flash"></div><p class="unfold-message">Some things are better<br><em>discussed over coffee.</em></p>`;document.body.appendChild(overlay);
const strips=overlay.querySelectorAll('.unfold-strip');strips.forEach((s,i)=>s.animate([{transform:'translateX(0)',opacity:1},{transform:`translateX(${i%2===0?-340:340}px) rotate(${i%2===0?-8:8}deg)`,opacity:0}],{duration:1300,delay:140+i*45,fill:'forwards',easing:'cubic-bezier(.64,0,.32,1)'}));overlay.querySelector('.unfold-message').animate([{opacity:0,transform:'translateY(20px)'},{opacity:1,transform:'translateY(0)'}],{duration:650,delay:750,fill:'forwards'});state.timer=setTimeout(()=>{overlay.remove();goto(4)},2050)}
function render(){el('content').innerHTML=sceneHTML();el('current-number').textContent='0'+(state.chapter+1);el('current-label').textContent=labels[state.chapter];el('chapters').innerHTML=labels.map((s,i)=>`<button class="chapter-pill ${i<=state.chapter?'is-reached':''} ${i===state.chapter?'is-active':''}" data-scene="${i}" aria-label="Kapitola ${i+1}: ${s}" ${i===state.chapter?'aria-current="step"':''}></button>`).join('');el('chapters').querySelectorAll('[data-scene]').forEach(btn=>btn.addEventListener('click',()=>goto(Number(btn.dataset.scene))));
el('next')?.addEventListener('click',next);el('yes')?.addEventListener('click',()=>{state.response='yes';render()});el('maybe')?.addEventListener('click',()=>{state.response='maybe';render()});el('no')?.addEventListener('click',()=>{state.response='no';render()});el('back')?.addEventListener('click',()=>{state.response=null;render()});el('copy')?.addEventListener('click',async()=>{const m='Ahoj, ten web bol celkom originálny 😄 Kedy dáme tú kávu?';let ok=false;try{await navigator.clipboard.writeText(m);ok=true}catch{} if(!ok){const fb=el('fallback');fb.hidden=false;const ta=fb.querySelector('textarea');ta.focus();ta.select();try{ok=document.execCommand('copy')}catch{}}el('copy').querySelector('span').textContent=ok?'Správa skopírovaná ✓':'Označ a skopíruj text nižšie'});el('stage').focus({preventScroll:true});window.scrollTo(0,0)}
el('home').addEventListener('click',()=>goto(0));el('skip').addEventListener('click',()=>goto(4));
el('audio').addEventListener('click',async()=>{try{if(!state.context){state.context=new(window.AudioContext||window.webkitAudioContext)();state.gain=state.context.createGain();state.gain.gain.value=0;state.gain.connect(state.context.destination);[174.61,261.63,349.23].forEach((freq,i)=>{const o=state.context.createOscillator(),g=state.context.createGain();o.type=i===2?'triangle':'sine';o.frequency.value=freq;g.gain.value=[.2,.08,.035][i];o.connect(g).connect(state.gain);o.start();state.osc.push(o)})}await state.context.resume();state.ambient=!state.ambient;state.gain.gain.setTargetAtTime(state.ambient?.14:0,state.context.currentTime,.15);el('audio').setAttribute('aria-pressed',String(state.ambient));el('audio-text').textContent=state.ambient?'ZVUK ZAP.':'ZVUK VYP.';el('bars').classList.toggle('on',state.ambient)}catch{el('audio-text').textContent='ZVUK NEDOSTUPNÝ';el('audio').disabled=true}});
render();})();</script></body></html>
